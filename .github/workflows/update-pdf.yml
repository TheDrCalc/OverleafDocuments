name: Fetch Overleaf PDF

on:
  schedule:
    - cron: "1 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download latest PDF
        run: |
          curl -L "https://www.overleaf.com/read/wmcrnrvpfdvf#45b041" -o AP2026.pdf

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
